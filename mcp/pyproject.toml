[project]
name = "vaultline-mcp"
version = "0.1.0"
description = "Vaultline MCP server: three restricted agent tools in front of the Vaultline security backend"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27", "pydantic>=2.6", "python-dotenv>=1.0.1"]

[project.optional-dependencies]
test = ["pytest>=8.0", "anyio>=4.0"]

[project.scripts]
vaultline-mcp = "vaultline_mcp.server:main"
vaultline-agent = "vaultline_agent.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
