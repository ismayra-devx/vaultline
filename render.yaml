# Vaultline on Render (Blueprint). Two public HTTPS services, PayPal Sandbox only.
#   vaultline-api  FastAPI security backend + PayPal Sandbox adapter
#   vaultline-mcp  MCP server (streamable HTTP) that agents connect to
# Nothing here runs on localhost: both services refuse to start in hosted mode without
# real secrets, the PayPal Sandbox adapter, and an https backend URL.
# Setup guide: docs/DEPLOY.md

services:
  - type: web
    name: vaultline-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: VAULTLINE_DEPLOYMENT
        value: hosted
      - key: VAULTLINE_PAYPAL_MODE
        value: sandbox
      # From developer.paypal.com > Apps & Credentials > Sandbox. Never commit these.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Optional: comma-separated fresh COMPLETED sandbox capture ids to register at startup.
      - key: VAULTLINE_SANDBOX_CAPTURE_IDS
        sync: false
      # Random 256-bit secrets generated by Render. Read them from the service's Environment tab.
      - key: VAULTLINE_AGENT_KEY
        generateValue: true
      - key: VAULTLINE_JUDGE_PASSWORD
        generateValue: true
      - key: VAULTLINE_DB_PATH
        value: vaultline.db

  - type: web
    name: vaultline-mcp
    runtime: python
    plan: free
    rootDir: mcp
    buildCommand: pip install -r requirements.txt
    startCommand: python -m vaultline_mcp
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: VAULTLINE_DEPLOYMENT
        value: hosted
      - key: VAULTLINE_MCP_TRANSPORT
        value: http
      # Public https URL of vaultline-api, e.g. https://vaultline-api.onrender.com (no trailing slash).
      # Render can only share private-network hostnames between services, so set this by hand.
      - key: VAULTLINE_API_BASE_URL
        sync: false
      # Deliberately NO VAULTLINE_AGENT_KEY here: each agent sends its own key.
